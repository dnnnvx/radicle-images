name: publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [node, httpd, explorer]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/radicle-${{ matrix.name }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags are the upstream x.y.z and immutable: a version is built and pushed once.
      # Pull requests always build (without pushing) to test the Dockerfile.
      - id: version
        run: |
          v=$(sed -n 's/^ARG VERSION=//p' ${{ matrix.name }}/Dockerfile)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          if [ "$PUSH" = true ] && docker buildx imagetools inspect "$IMAGE:$v" >/dev/null 2>&1; then
            echo "$IMAGE:$v already published" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        if: steps.version.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.version.outputs.value }}
      - if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
